<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web-to-Lead Test · Lead Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="page">
      <header class="brand">
        <p class="brand__mark">Lead Capture Lab</p>
        <h1 class="brand__title">Salesforce Web-to-Lead</h1>
        <p class="brand__lede">
          Test harness for the consign lead form. Submit to create a lead in org
          <code>00D1N000001BsY8</code>.
        </p>
      </header>

      <form
        class="lead-form"
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00D1N000001BsY8"
        method="POST"
      >
        <input type="hidden" name="oid" value="00D1N000001BsY8" />
        <input type="hidden" name="retURL" value="http://therealreal.com" />

        <!-- Optional debug mode — uncomment to test without creating live leads:
        <input type="hidden" name="debug" value="1" />
        <input type="hidden" name="debugEmail" value="david.garcia2@therealreal.com" />
        -->

        <div class="field">
          <label for="first_name">First Name</label>
          <input
            id="first_name"
            name="first_name"
            type="text"
            maxlength="40"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="field">
          <label for="last_name">Last Name</label>
          <input
            id="last_name"
            name="last_name"
            type="text"
            maxlength="80"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="field field--full">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            maxlength="80"
            autocomplete="email"
            required
          />
        </div>

        <div class="field field--full">
          <label for="company">Company</label>
          <input
            id="company"
            name="company"
            type="text"
            maxlength="40"
            autocomplete="organization"
          />
        </div>

        <div class="field">
          <label for="city">City</label>
          <input
            id="city"
            name="city"
            type="text"
            maxlength="40"
            autocomplete="address-level2"
          />
        </div>

        <div class="field">
          <label for="state">State / Province</label>
          <input
            id="state"
            name="state"
            type="text"
            maxlength="20"
            autocomplete="address-level1"
          />
        </div>

        <div class="field field--full">
          <label for="lead_source">Lead Source</label>
          <select id="lead_source" name="lead_source">
            <option value="">--None--</option>
            <option value="consign_banner">consign_banner</option>
            <option value="consign_funnel_app">consign_funnel_app</option>
            <option value="consign_funnel_desktop">consign_funnel_desktop</option>
            <option value="consign_funnel_mobile_web">consign_funnel_mobile_web</option>
            <option value="consign_funnel_website">consign_funnel_website</option>
            <option value="consignment_kit">consignment_kit</option>
            <option value="consignor_estimator">consignor_estimator</option>
            <option value="email_marketing">email_marketing</option>
            <option value="facebook_lead_form">facebook_lead_form</option>
            <option value="facebook_messenger">facebook_messenger</option>
            <option value="inbound_request">inbound_request</option>
            <option value="l2i_pilot">l2i_pilot</option>
            <option value="linkedin_lead_form">linkedin_lead_form</option>
            <option value="Marketing Generated Lead">Marketing Generated Lead</option>
            <option value="partnership">partnership</option>
            <option value="reconsign">reconsign</option>
            <option value="retail_store">retail_store</option>
            <option value="self_generated">self_generated</option>
            <option value="Site">Site</option>
            <option value="white_glove_survey">white_glove_survey</option>
            <option value="wordpress">wordpress</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" name="submit">Submit lead</button>
          <p class="hint">
            After submit, Salesforce redirects to
            <a href="http://therealreal.com" rel="noopener">therealreal.com</a>.
          </p>
        </div>
      </form>
    </main>
  </body>
</html>
